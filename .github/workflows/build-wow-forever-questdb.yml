name: Build WoW Forever QuestDB
on:
  workflow_dispatch:
  push:
    paths:
      - 'WoWForeverQuestDB/build_db.py'
      - 'WoWForeverQuestDB/README_RU.md'
      - '.github/workflows/build-wow-forever-questdb.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build SQLite CSV HTML
        run: |
          python WoWForeverQuestDB/build_db.py --cache WoWForeverQuestDB/.source-cache --out WoWForeverQuestDB/dist
          python - <<'PY'
          import sqlite3, json, zipfile
          from pathlib import Path
          root=Path('WoWForeverQuestDB/dist')
          stats=json.loads((root/'coverage.json').read_text(encoding='utf-8'))
          assert stats['questie_count'] >= 4600, stats
          assert stats['rows'] >= 4600, stats
          assert stats['actor_coordinate_rows'] > 1000, stats
          with sqlite3.connect(root/'wow_forever_quests.sqlite') as c:
              assert c.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
              assert c.execute('SELECT COUNT(*) FROM quests').fetchone()[0] == stats['rows']
          with zipfile.ZipFile(root/'WoWForeverQuestDB_full.zip') as z:
              assert z.testzip() is None
              assert 'wow_forever_quests.sqlite' in z.namelist()
          print(stats)
          PY
      - name: Commit database artifacts
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add -f WoWForeverQuestDB/dist/WoWForeverQuestDB_full.zip WoWForeverQuestDB/dist/wow_forever_quests.sqlite WoWForeverQuestDB/dist/quests.csv WoWForeverQuestDB/dist/locations.csv WoWForeverQuestDB/dist/rewards.csv WoWForeverQuestDB/dist/chains.csv WoWForeverQuestDB/dist/quests_browser.html WoWForeverQuestDB/dist/coverage.json
          if git diff --cached --quiet; then echo 'Already current'; else git commit -m 'Build WoW Forever quest database from public snapshots'; git push; fi