name: Обновление цен аукциона

on:
  schedule:
    - cron: '23 * * * *'   # каждый час в :23 (UTC)
  workflow_dispatch:        # ручной запуск из вкладки Actions
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Собрать цены
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          REGION: ${{ vars.REGION || 'eu' }}
          FACTION: ${{ vars.FACTION || 'alliance' }}
          RULESET_ID: ${{ vars.RULESET_ID }}
          HOUSE_ID: ${{ vars.HOUSE_ID }}
          OUT_DIR: site/data
        run: node scripts/fetch.mjs

      - name: Собрать сайт и аддон
        run: |
          cp index.html site/index.html
          cp data/categories.json site/data/categories.json
          mkdir -p site/addon
          cd addon && zip -r ../site/addon/WolfichMarket.zip WolfichMarket && cd ..
          echo "{\"version\":\"$(sed -n 's/^## Version: *//p' addon/WolfichMarket/WolfichMarket.toc | tr -d '\r')\"}" > site/addon/version.json
          touch site/.nojekyll
          # программа для Windows
          P=build/WOLFICH-Market
          mkdir -p $P/program site/app
          cp app/SETUP.bat app/README.txt $P/
          cp app/main.js app/preload.js app/savedvars.js app/package.json app/icon.png app/icon.ico index.html scripts/fetch.mjs $P/program/
          cp -r addon $P/program/addon
          (cd build && zip -qr ../site/app/WolfichMarket-App.zip WOLFICH-Market)
          cp app/icon.png site/app/icon.png
          node -e "console.log(JSON.stringify({version:require('./app/package.json').version}))" > site/app/version.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
